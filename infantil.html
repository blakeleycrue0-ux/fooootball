<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infantil Femenino</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Anton&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0a0a0a;
    color:white;
    font-family:'Inter', sans-serif;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:1000;
    background:transparent;
}

.logo-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    height:35px;
}

.club-name{
    font-family:'Oswald', sans-serif;
    font-size:18px;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-weight:700;
}

/* HERO */
.hero{
    height:45vh;
    display:flex;
    align-items:flex-end;
    padding:30px;
    background:linear-gradient(
        135deg,
        #2d0b59 0%,
        #5b21b6 45%,
        #7c3aed 100%
    );
}

.hero h1{
    font-family:'Anton', sans-serif;
    font-size:55px;
    line-height:0.9;
    text-transform:uppercase;
}

/* SECTION */
.section{
    padding:30px 20px;
}

.section-title{
    font-size:12px;
    opacity:0.6;
    margin-bottom:20px;
}

/* PLAYERS */
.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.player-card{
    background:#f2f2f2;
    color:black;
    text-decoration:none;
    padding:25px;
    min-height:180px;
    clip-path:polygon(
        0 0,
        100% 0,
        100% 82%,
        90% 100%,
        0 100%
    );
    transition:0.3s;
}

.player-card:hover{
    transform:translateY(-5px);
}

.player-card small{
    color:#7c3aed;
    font-weight:700;
}

.player-card h3{
    font-family:'Anton', sans-serif;
    font-size:32px;
    margin:12px 0;
    text-transform:uppercase;
}

.player-card p{
    color:#444;
    margin-bottom:15px;
}

.number{
    display:inline-block;
    background:black;
    color:white;
    padding:8px 14px;
    font-weight:700;
}

/* TABLE */
.table{
    background:#111;
    border-radius:16px;
    overflow:hidden;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.head{
    background:#1a1a1a;
    font-weight:700;
    text-transform:uppercase;
}

.row span{
    width:16%;
    text-align:center;
    font-size:14px;
}

/* SANTA PONSA HIGHLIGHT */
.santa-row{
    background:linear-gradient(
        90deg,
        rgba(124,58,237,0.25),
        rgba(124,58,237,0.08)
    );
    border-left:4px solid #a855f7;
    font-weight:700;
}

/* MOBILE */
@media(max-width:768px){

    .hero{
        height:35vh;
    }

    .hero h1{
        font-size:42px;
    }

    .row span{
        font-size:11px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo-title">
        <img src="Logoclub.png" class="logo">
        <div class="club-name">FEMENINO</div>
    </div>

    <a href="equipos.html" class="back-btn">← Volver</a>

</header>

<!-- HERO -->
<section class="hero">
    <h1>INFANTIL<br>TEAM</h1>
</section>

<!-- PLAYERS -->
<section class="section">

    <div class="section-title">SQUAD</div>

    <div class="players-grid">

        <a href="lucia.html" class="player-card">
            <small>FORWARD</small>
            <h3>LUCÍA</h3>
            <p>Lucía Martínez</p>
            <div class="number">#9</div>
        </a>

        <a href="sofia.html" class="player-card">
            <small>MIDFIELDER</small>
            <h3>SOFÍA</h3>
            <p>Sofía Pérez</p>
            <div class="number">#8</div>
        </a>

        <a href="carla.html" class="player-card">
            <small>DEFENDER</small>
            <h3>CARLA</h3>
            <p>Carla Gómez</p>
            <div class="number">#4</div>
        </a>

    </div>

</section>

<!-- TABLE -->
<section class="section">

    <div class="section-title">LEAGUE TABLE</div>

    <div id="table" class="table"></div>

</section>

<script>

const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5vTKhCnEoTacQdpcmWgqiiBGrVZmyQBpG59Pdg1ipAT2nAYuFynAlfa9i_ICdd9Kt2UvHlbC1JCE4/pub?output=csv";

function parseRow(row){
    return row.split(/[,;]/).map(x => x.trim());
}

async function loadTable(){

    const container = document.getElementById("table");

    try{

        const res = await fetch(URL + "&t=" + Date.now(), {
            cache:"no-store"
        });

        const text = await res.text();
        const rows = text.split("\n").filter(r => r.trim());

        let teams = [];

        for(let i=1;i<rows.length;i++){

            const c = parseRow(rows[i]);

            teams.push({
                name: c[0] || "-",
                pj: c[1] || "0",
                pg: c[2] || "0",
                pe: c[3] || "0",
                pp: c[4] || "0",
                pts: parseInt(c[5]) || 0
            });
        }

        /* ordenar por puntos */
        teams.sort((a,b) => b.pts - a.pts);

        let html = `
        <div class="row head">
            <span>TEAM</span>
            <span>PJ</span>
            <span>PG</span>
            <span>PE</span>
            <span>PP</span>
            <span>PTS</span>
        </div>
        `;

        teams.forEach(team=>{

            const isSantaPonsa =
                team.name.toLowerCase().includes("santa ponsa");

            html += `
            <div class="row ${isSantaPonsa ? "santa-row" : ""}">
                <span>${team.name}</span>
                <span>${team.pj}</span>
                <span>${team.pg}</span>
                <span>${team.pe}</span>
                <span>${team.pp}</span>
                <span>${team.pts}</span>
            </div>
            `;
        });

        container.innerHTML = html;

    }catch(err){

        container.innerHTML = `
        <div style="padding:20px;text-align:center;">
            Error cargando datos
        </div>
        `;
    }
}

loadTable();

</script>

</body>
</html>
</script>
</body>
</html>
