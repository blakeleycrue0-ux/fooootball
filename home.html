<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femenino SP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Anton&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0a0a0a;
    color:white;
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:1000;
    background:transparent;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-icon{
    font-size:28px;
    cursor:pointer;
}

.logo{
    height:35px;
}

.club-name{
    font-family:'Oswald', sans-serif;
    font-size:18px;
    letter-spacing:1px;
}

/* USER */
.user-wrapper{
    position:relative;
}

.user{
    cursor:pointer;
    font-weight:700;
}

.user-menu{
    position:absolute;
    top:35px;
    right:0;
    background:white;
    color:black;
    border-radius:10px;
    padding:10px;
    display:none;
    min-width:140px;
}

.user-menu button{
    width:100%;
    border:none;
    background:none;
    padding:10px;
    cursor:pointer;
    font-weight:700;
}

/* MOBILE MENU */
.mobile-menu{
    position:fixed;
    top:0;
    left:-100%;
    width:100%;
    height:100vh;
    background:white;
    color:black;
    z-index:2000;
    padding:30px;
    transition:0.4s;
}

.mobile-menu.active{
    left:0;
}

.close-menu{
    font-size:40px;
    cursor:pointer;
    margin-bottom:30px;
}

.menu-title{
    font-family:'Anton', sans-serif;
    font-size:45px;
    margin-bottom:40px;
}

.mobile-menu a{
    display:block;
    color:black;
    text-decoration:none;
    font-size:28px;
    font-weight:700;
    margin:25px 0;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    align-items:flex-end;
    padding:30px;
    background:
    linear-gradient(to top, rgba(45,11,89,0.9), rgba(0,0,0,0.2)),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-family:'Anton', sans-serif;
    font-size:58px;
    line-height:0.95;
    text-transform:uppercase;
}

/* SECTION */
.section{
    padding:20px;
}

.title{
    font-size:12px;
    opacity:0.6;
    margin-bottom:15px;
}

/* MATCHES */
.matches-scroll{
    display:flex;
    gap:18px;
    overflow-x:auto;
    padding-bottom:10px;
}

.matches-scroll::-webkit-scrollbar{
    display:none;
}

/* NUEVAS CARDS estilo equipos */
.card{
    min-width:290px;
    background:#f2f2f2;
    color:black;
    padding:22px;
    flex-shrink:0;
    clip-path:polygon(
        0 0,
        100% 0,
        100% 82%,
        90% 100%,
        0 100%
    );
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.status{
    color:#7c3aed;
    font-weight:700;
    font-size:12px;
    margin-bottom:15px;
    text-transform:uppercase;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:14px 0;
}

.row span:first-child{
    font-family:'Anton', sans-serif;
    font-size:28px;
    text-transform:uppercase;
    line-height:0.9;
}

.row span:last-child{
    font-family:'Anton', sans-serif;
    font-size:32px;
    color:#7c3aed;
}

/* NEWS */
.main-news{
    background:#111;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:20px;
}

.main-news img{
    width:100%;
    height:240px;
    object-fit:cover;
}

.main-news-content{
    padding:20px;
}

.main-news-content h2{
    font-family:'Anton', sans-serif;
    font-size:32px;
    margin-bottom:10px;
}

.main-news-content p{
    color:#ccc;
    line-height:1.5;
}

.small-news{
    display:flex;
    gap:12px;
    overflow-x:auto;
}

.small-news-card{
    min-width:220px;
    background:#111;
    border-radius:12px;
    overflow:hidden;
}

.small-news-card img{
    width:100%;
    height:120px;
    object-fit:cover;
}

.small-news-card div{
    padding:12px;
    font-weight:600;
}

.spacer{
    height:80px;
}

</style>
</head>

<body>

<header>
    <div class="header-left">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <img src="Logoclub.png" class="logo">
        <div class="club-name">FEMENINO</div>
    </div>

    <div class="user-wrapper">
        <div class="user" onclick="toggleUserMenu()">
            <span id="username">Usuario</span>
        </div>

        <div class="user-menu" id="userMenu">
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</header>

<!-- MENU -->
<div class="mobile-menu" id="mobileMenu">
    <div class="close-menu" onclick="toggleMenu()">×</div>

    <div class="menu-title">FEMENINO SP</div>

    <a href="home.html">NEWS</a>
    <a href="equipos.html">TEAMS</a>
    <a href="#">CLUB</a>
    <a href="#">SHOP</a>
</div>

<!-- HERO -->
<div class="hero">
    <h1>FEMENINO<br>SANTA PONSA</h1>
</div>

<!-- MATCHES -->
<div class="section">
    <div class="title">MATCHES</div>
    <div class="matches-scroll" id="matches"></div>
</div>

<!-- NEWS -->
<div class="section">
    <div class="title">LATEST NEWS</div>

    <div class="main-news">
        <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018">
        <div class="main-news-content">
            <h2>Gran victoria del Femenino Santa Ponsa</h2>
            <p>
                El equipo logró una victoria importante este fin de semana
                tras dominar durante todo el partido.
            </p>
        </div>
    </div>

    <div class="small-news">
        <div class="small-news-card">
            <img src="https://images.unsplash.com/photo-1518604666860-9ed391f76460">
            <div>Convocatoria oficial</div>
        </div>

        <div class="small-news-card">
            <img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0">
            <div>Entrenamiento semanal</div>
        </div>
    </div>
</div>

<div class="spacer"></div>

<script>

const user = localStorage.getItem("user");

if(!user){
    window.location.href="login.html";
}

document.getElementById("username").innerText = user;

function toggleUserMenu(){
    const menu = document.getElementById("userMenu");
    menu.style.display =
        menu.style.display === "block" ? "none" : "block";
}

function logout(){
    localStorage.removeItem("user");
    window.location.href="login.html";
}

function toggleMenu(){
    document
        .getElementById("mobileMenu")
        .classList.toggle("active");
}

/* MATCHES */
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfAIC8-HY_kpednFu3CUewnmg-_Uy52_ZOBGWQx_oSe_0Dr4hVZS_BicuNUnIFLXu18L4LdZXin2qx/pub?output=csv";

async function load(){

    const res = await fetch(URL);
    const text = await res.text();

    const rows = text.split("\n").filter(r => r.trim());

    let html = "";

    for(let i=1;i<rows.length;i++){

        const c = rows[i]
            .split(",")
            .map(x => x.replace(/"/g,"").trim());

        if(!c[1]) continue;

        html += `
        <div class="card">
            <div class="status">${c[0]}</div>

            <div class="row">
                <span>${c[1]}</span>
                <span>${c[2]}</span>
            </div>

            <div class="row">
                <span>${c[3]}</span>
                <span>${c[4]}</span>
            </div>
        </div>
        `;
    }

    document.getElementById("matches").innerHTML = html;
}

load();

</script>

</body>
</html>

</body>
</html>
