<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infantil | Femenino Santa Ponsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white: #f5f2ec;
  --black: #080808;
  --purple: #c084fc;
  --purple-dark: #2d0a52;
  --gray: #a0a09a;
  --card-bg: #0f0f0f;
  --border: rgba(245,242,236,0.09);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9990; opacity: 0.35;
}

/* CURSOR */
#cursor {
  position: fixed; top: 0; left: 0; width: 10px; height: 10px;
  background: var(--purple); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.12s, background 0.3s;
}
#cursor-ring {
  position: fixed; top: 0; left: 0; width: 36px; height: 36px;
  border: 1px solid rgba(192,132,252,0.45); border-radius: 50%;
  pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  transition: width 0.3s, height 0.3s;
}

/* HEADER */
header {
  position: fixed; top: 0; left: 0; width: 100%; height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; z-index: 1000; transition: background 0.4s;
}
header.scrolled {
  background: rgba(8,8,8,0.96);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.logo { height: 40px; }
.back-link {
  display: flex; align-items: center; gap: 8px;
  color: var(--gray); text-decoration: none;
  font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
  transition: color 0.3s;
}
.back-link:hover { color: var(--white); }

/* HERO */
.hero {
  position: relative; height: 52vh; min-height: 320px;
  display: flex; align-items: flex-end; overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0;
  background: url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1400&q=80") center/cover no-repeat;
  filter: brightness(0.28) saturate(0.5);
  transform: scale(1.04); transition: transform 6s ease;
}
.hero-bg.loaded { transform: scale(1); }
.hero-vignette {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(8,8,8,1) 0%, rgba(8,8,8,0.3) 50%, transparent 80%),
              linear-gradient(to right, rgba(8,8,8,0.6), transparent 60%);
}
.hero-content { position: relative; z-index: 2; padding: 40px 28px; }
.hero-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--purple); margin-bottom: 14px;
  opacity: 0; transform: translateY(16px);
  animation: fadeUp 0.7s 0.2s forwards;
}
.hero h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(64px, 16vw, 120px); line-height: 0.88; letter-spacing: 0.01em;
  opacity: 0; transform: translateY(24px);
  animation: fadeUp 0.8s 0.4s forwards;
}
.hero h1 em { font-style: normal; -webkit-text-stroke: 1.5px var(--white); color: transparent; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* PAGE */
.page { padding: 60px 28px 100px; max-width: 900px; margin: 0 auto; }

/* EYEBROW + LABEL */
.block-label {
  display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
}
.block-label-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--purple); white-space: nowrap;
}
.block-label-line { flex: 1; height: 1px; background: var(--border); }

/* BLOCKS */
.block { margin-bottom: 56px; }

/* SQUAD TOGGLE */
.squad-toggle {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px; overflow: hidden;
}
.squad-toggle summary {
  list-style: none; cursor: pointer;
  padding: 24px 28px;
  display: flex; align-items: center; justify-content: space-between;
  transition: background 0.2s;
}
.squad-toggle summary::-webkit-details-marker { display: none; }
.squad-toggle summary:hover { background: #111; }
.squad-toggle-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px; letter-spacing: 0.04em;
}
.squad-toggle-meta { font-size: 13px; color: var(--gray); font-weight: 300; }
.squad-chevron {
  width: 20px; height: 20px; color: var(--purple);
  transition: transform 0.35s;
  flex-shrink: 0;
}
details[open] .squad-chevron { transform: rotate(180deg); }

/* PLAYERS LIST */
.players-list { border-top: 1px solid var(--border); }
.player-item {
  display: flex; align-items: center;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
  gap: 16px;
}
.player-item:last-child { border-bottom: none; }
.player-item:hover { background: rgba(192,132,252,0.04); }
.player-dorsal {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; color: rgba(192,132,252,0.35);
  min-width: 36px; line-height: 1;
}
.player-name {
  flex: 1; font-size: 15px; font-weight: 500;
}
.player-pos {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gray);
  background: rgba(245,242,236,0.05);
  padding: 4px 10px; border-radius: 2px;
}

/* STANDINGS TABLE */
.standings {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px; overflow: hidden;
}
.standings-row {
  display: grid;
  grid-template-columns: 2fr repeat(5, 1fr);
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  font-size: 14px;
  transition: background 0.2s;
}
.standings-row:last-child { border-bottom: none; }
.standings-row:not(.head):hover { background: rgba(192,132,252,0.04); }
.standings-row.head {
  background: #111;
  padding: 12px 20px;
}
.standings-row.head span {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gray);
}
.standings-row span:not(:first-child) { text-align: center; }
.team-col { display: flex; align-items: center; gap: 10px; }
.team-pos {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; color: rgba(245,242,236,0.2);
  min-width: 20px;
}
.team-name { font-weight: 500; }
.pts-col {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; color: var(--white);
  text-align: center;
}

/* HIGHLIGHT ROW */
.standings-row.highlight {
  border-left: 2px solid var(--purple);
  background: rgba(192,132,252,0.06);
}
.standings-row.highlight .team-pos { color: rgba(192,132,252,0.5); }
.standings-row.highlight .pts-col { color: var(--purple); }

/* LOADING SKELETON */
.skeleton-row {
  display: grid; grid-template-columns: 2fr repeat(5,1fr);
  padding: 14px 20px; border-bottom: 1px solid var(--border); gap: 8px;
}
.skel {
  height: 14px; border-radius: 2px;
  background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* REVEAL */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.75s ease, transform 0.75s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* DESKTOP */
@media (min-width: 700px) {
  header { padding: 0 60px; }
  .hero-content { padding: 50px 60px; }
  .page { padding: 70px 60px 120px; }
  .standings-row { padding: 14px 28px; font-size: 15px; }
  .player-item { padding: 18px 32px; }
  .squad-toggle summary { padding: 26px 32px; }
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<header id="header">
  <img src="Logoclub.png" class="logo" alt="Femenino Santa Ponsa">
  <a href="equipos.html" class="back-link">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Equipos
  </a>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-vignette"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">Academy · Femenino Santa Ponsa</p>
    <h1><em>Infantil</em></h1>
  </div>
</section>

<!-- PAGE -->
<div class="page">

  <!-- PLANTILLA -->
  <div class="block reveal">
    <div class="block-label">
      <span class="block-label-text">Plantilla</span>
      <div class="block-label-line"></div>
    </div>

    <details class="squad-toggle" id="squadDetails">
      <summary>
        <div>
          <div class="squad-toggle-title">Ver jugadoras</div>
          <div class="squad-toggle-meta">Temporada 2024/25</div>
        </div>
        <svg class="squad-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="players-list">
        <div class="player-item">
          <div class="player-dorsal">1</div>
          <div class="player-name">Marina Torres</div>
          <div class="player-pos">Portera</div>
        </div>
        <div class="player-item">
          <div class="player-dorsal">4</div>
          <div class="player-name">Carla Gómez</div>
          <div class="player-pos">Defensa</div>
        </div>
        <div class="player-item">
          <div class="player-dorsal">8</div>
          <div class="player-name">Sofía Pérez</div>
          <div class="player-pos">Centrocampista</div>
        </div>
        <div class="player-item">
          <div class="player-dorsal">9</div>
          <div class="player-name">Lucía Martínez</div>
          <div class="player-pos">Delantera</div>
        </div>
        <div class="player-item">
          <div class="player-dorsal">11</div>
          <div class="player-name">Paula Serra</div>
          <div class="player-pos">Extremo</div>
        </div>
      </div>
    </details>
  </div>

  <!-- CLASIFICACIÓN -->
  <div class="block reveal" style="transition-delay:0.1s">
    <div class="block-label">
      <span class="block-label-text">Clasificación</span>
      <div class="block-label-line"></div>
    </div>

    <div class="standings" id="table">
      <!-- skeleton -->
      <div class="standings-row head">
        <span>Equipo</span><span>PJ</span><span>PG</span><span>PE</span><span>PP</span><span>PTS</span>
      </div>
      <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </div>
  </div>

</div>

<script>
// CURSOR
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
(function anim(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(anim);})();
document.querySelectorAll('a,button,summary,.player-item').forEach(el=>{
  el.addEventListener('mouseenter',()=>{cursor.style.transform='translate(-50%,-50%) scale(2.5)';ring.style.width='56px';ring.style.height='56px';});
  el.addEventListener('mouseleave',()=>{cursor.style.transform='translate(-50%,-50%) scale(1)';ring.style.width='36px';ring.style.height='36px';});
});

// HEADER
window.addEventListener('scroll',()=>document.getElementById('header').classList.toggle('scrolled',scrollY>60));

// HERO BG
document.getElementById('heroBg').classList.add('loaded');

// REVEAL
const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');}),{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

// STANDINGS
const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5vTKhCnEoTacQdpcmWgqiiBGrVZmyQBpG59Pdg1ipAT2nAYuFynAlfa9i_ICdd9Kt2UvHlbC1JCE4/pub?output=csv";

async function loadTable(){
  const container = document.getElementById('table');
  try {
    const res = await fetch(CSV + '&t=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    const rows = text.split('\n').filter(r => r.trim());
    let equipos = [];
    for(let i=1;i<rows.length;i++){
      const c = rows[i].split(/[,;]/).map(x=>x.trim());
      equipos.push({ nombre:c[0]||'-', pj:c[1]||'0', pg:c[2]||'0', pe:c[3]||'0', pp:c[4]||'0', puntos:parseInt(c[5])||0 });
    }
    equipos.sort((a,b)=>b.puntos-a.puntos);

    let html = `<div class="standings-row head">
      <span>Equipo</span><span>PJ</span><span>PG</span><span>PE</span><span>PP</span><span>PTS</span>
    </div>`;

    equipos.forEach((eq,i)=>{
      const sp = eq.nombre.toLowerCase().includes('santa ponsa');
      html += `<div class="standings-row ${sp?'highlight':''}">
        <div class="team-col">
          <span class="team-pos">${i+1}</span>
          <span class="team-name">${eq.nombre}</span>
        </div>
        <span>${eq.pj}</span>
        <span>${eq.pg}</span>
        <span>${eq.pe}</span>
        <span>${eq.pp}</span>
        <span class="pts-col">${eq.puntos}</span>
      </div>`;
    });

    container.innerHTML = html;
  } catch(err) {
    container.innerHTML = `<div style="padding:28px;text-align:center;color:var(--gray);font-size:14px">Error cargando clasificación</div>`;
  }
}
loadTable();
</script>
</body>
</html>
