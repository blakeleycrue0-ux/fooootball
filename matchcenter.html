<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Center</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#0b0b0b;
    color:white;
}

/* HEADER MATCH */
.top{
    padding:40px 8%;
    text-align:center;
}

.status{
    font-size:14px;
    font-weight:700;
    opacity:.7;
    text-transform:uppercase;
}

.teams{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin-top:20px;
}

.team{
    text-align:center;
}

.team img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.team-name{
    margin-top:10px;
    font-weight:700;
}

.score{
    font-size:50px;
    font-weight:900;
}

/* EVENTS */
.events{
    max-width:800px;
    margin:40px auto;
    padding:0 20px;
}

.event{
    display:flex;
    gap:15px;
    padding:15px;
    border-left:3px solid #333;
    margin-bottom:15px;
    background:#151515;
    border-radius:8px;
}

.minute{
    font-weight:900;
    color:#999;
    width:50px;
}

.event-text{
    flex:1;
}

.type{
    font-weight:700;
    font-size:14px;
    opacity:.8;
}

</style>
</head>

<body>

<div class="top">

    <div class="status" id="status">FINAL</div>

    <div class="teams">

        <div class="team">
            <img id="logoHome">
            <div class="team-name" id="home"></div>
        </div>

        <div class="score" id="score">0 - 0</div>

        <div class="team">
            <img id="logoAway">
            <div class="team-name" id="away"></div>
        </div>

    </div>

</div>

<div class="events" id="events"></div>

<script>

const MATCHSHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQa33RBs9U2PKwF4XVxyYcxfWCsAmlBcowlfUG9B2KIGh6bZLF6MSbTvvYrDuMi_MDXStAlB0p2V1AQ/pub?output=csv";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* LOAD DATA */
fetch(MATCHSHEET)
.then(r=>r.text())
.then(text=>{

    const rows = text.split("\n").map(r=>r.split(","));

    for(let i=1;i<rows.length;i++){

        const c = rows[i];

        if(c[0] !== id) continue;

        document.getElementById("status").innerText = c[1];
        document.getElementById("home").innerText = c[2];
        document.getElementById("away").innerText = c[4];
        document.getElementById("score").innerText = c[3] + " - " + c[5];

        document.getElementById("logoHome").src = c[6];
        document.getElementById("logoAway").src = c[7];

        break;
    }
});

</script>

</body>
</html>

</body>
</html>
