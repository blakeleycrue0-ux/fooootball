<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infantil | Femenino Santa Ponsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Familjen+Grotesk:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root {
  --c: #0a0a0a;
  --w: #f4f0e8;
  --acc: #a855f7;
  --acc2: #d8b4fe;
  --mid: #888;
  --border: rgba(10,10,10,0.12);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--w);color:var(--c);font-family:'Familjen Grotesk',sans-serif;overflow-x:hidden;}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:500;
  transition:background .4s;
}
@media(min-width:700px){header{padding:0 32px;}}
header.scrolled{
  background:rgba(244,240,232,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo-img{height:40px;width:auto;}
.back-link{
  display:flex;align-items:center;gap:8px;
  font-family:'Unbounded',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--c);text-decoration:none;transition:color .3s;
}
.back-link:hover{color:var(--acc);}
.back-link svg{width:14px;height:14px;transition:transform .3s;}
.back-link:hover svg{transform:translateX(-3px);}

/* HERO */
.hero{
  position:relative;min-height:55vh;
  background:var(--c);
  display:flex;align-items:flex-end;overflow:hidden;
}
.hero-photo{
  position:absolute;inset:0;
  background:url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1600&q=85') center 40%/cover no-repeat;
  transform:scale(1.06);
  animation:heroZoom 12s ease-out forwards;
  filter:saturate(.6) brightness(.35);
}
@keyframes heroZoom{from{transform:scale(1.06);}to{transform:scale(1.0);}}
.hero-tint{
  position:absolute;inset:0;
  background:
    linear-gradient(to top,rgba(10,10,10,1) 0%,rgba(10,10,10,.5) 40%,rgba(88,28,220,.15) 75%,transparent 100%),
    linear-gradient(to right,rgba(10,10,10,.55) 0%,transparent 55%);
}
.hero-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.25;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;mix-blend-mode:overlay;
}
.hero-inner{
  position:relative;z-index:2;
  padding:100px 20px 50px;width:100%;
}
@media(min-width:700px){.hero-inner{padding:130px 60px 70px;}}

.hero-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(244,240,232,.4);
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
  opacity:0;transform:translateY(14px);
  animation:fadeUp .7s .3s forwards;
}
.hero-eyebrow::before{content:'';display:block;width:20px;height:1px;background:var(--acc);}
.hero-title{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(48px,14vw,140px);font-weight:900;
  letter-spacing:-.04em;line-height:.88;
  color:transparent;-webkit-text-stroke:1.5px rgba(244,240,232,.5);
  text-transform:uppercase;
  opacity:0;transform:translateY(30px);
  animation:fadeUp .9s .4s forwards;
}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

/* PAGE */
.page{padding:50px 20px 100px;max-width:860px;margin:0 auto;}
@media(min-width:700px){.page{padding:70px 60px 120px;}}

.block{margin-bottom:56px;}

.tag-line{
  font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--mid);margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.tag-line::before{content:'';display:block;width:22px;height:1px;background:var(--c);}

/* SQUAD TOGGLE */
.squad-toggle{background:var(--c);overflow:hidden;border:2px solid var(--c);}
.squad-toggle summary{
  list-style:none;cursor:pointer;
  padding:20px 22px;
  display:flex;align-items:center;justify-content:space-between;
  transition:background .2s;
}
.squad-toggle summary::-webkit-details-marker{display:none;}
.squad-toggle summary:hover{background:#1a1a1a;}
.squad-toggle-title{
  font-family:'Unbounded',sans-serif;
  font-size:15px;font-weight:700;text-transform:uppercase;color:var(--w);
}
.squad-toggle-meta{font-size:12px;color:rgba(244,240,232,.3);margin-top:3px;}
.squad-chevron{width:18px;height:18px;color:var(--acc);transition:transform .35s;flex-shrink:0;}
details[open] .squad-chevron{transform:rotate(180deg);}

/* PLAYERS */
.players-list{border-top:1px solid rgba(244,240,232,.07);}
a.player-item{
  display:flex;align-items:center;gap:14px;
  padding:15px 22px;
  border-bottom:1px solid rgba(244,240,232,.06);
  text-decoration:none;
  transition:background .2s;
}
a.player-item:last-child{border-bottom:none;}
a.player-item:hover{background:rgba(168,85,247,.08);}
.player-dorsal{
  font-family:'Unbounded',sans-serif;
  font-size:18px;font-weight:900;
  color:rgba(168,85,247,.3);min-width:32px;line-height:1;
}
.player-name{flex:1;font-size:15px;font-weight:400;color:var(--w);}
.player-pos{
  font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(244,240,232,.3);
}

/* STANDINGS */
.standings{background:var(--c);border:2px solid var(--c);overflow:hidden;}
.standings-row{
  display:grid;grid-template-columns:2fr repeat(5,1fr);
  padding:13px 18px;
  border-bottom:1px solid rgba(244,240,232,.06);
  align-items:center;font-size:13px;
  transition:background .2s;
}
@media(min-width:700px){.standings-row{padding:14px 24px;font-size:14px;}}
.standings-row:last-child{border-bottom:none;}
.standings-row:not(.head):hover{background:rgba(168,85,247,.04);}
.standings-row.head{background:#111;padding:12px 18px;}
@media(min-width:700px){.standings-row.head{padding:12px 24px;}}
.standings-row.head span{
  font-family:'Unbounded',sans-serif;
  font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(244,240,232,.3);
}
.standings-row span:not(:first-child){text-align:center;}
.team-col{display:flex;align-items:center;gap:8px;}
.team-pos{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:900;color:rgba(244,240,232,.15);min-width:18px;}
.team-name{font-weight:400;font-size:13px;color:rgba(244,240,232,.8);}
.pts-col{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:900;color:var(--w);text-align:center;}
.standings-row.highlight{border-left:3px solid var(--acc);background:rgba(168,85,247,.07);}
.standings-row.highlight .team-pos{color:rgba(168,85,247,.5);}
.standings-row.highlight .pts-col{color:var(--acc2);}

.skeleton-row{display:grid;grid-template-columns:2fr repeat(5,1fr);padding:13px 18px;border-bottom:1px solid rgba(244,240,232,.06);gap:8px;}
.skel{height:12px;border-radius:2px;background:linear-gradient(90deg,#111 25%,#1a1a1a 50%,#111 75%);background-size:200% 100%;animation:shim 1.5s infinite;}
@keyframes shim{to{background-position:-200% 0;}}

/* SCROLL REVEAL */
.sr{opacity:0;transform:translateY(36px);transition:opacity .9s ease,transform .9s ease;}
.sr.in{opacity:1;transform:translateY(0);}
.sr-l{opacity:0;transform:translateX(-30px);transition:opacity .9s ease,transform .9s ease;}
.sr-l.in{opacity:1;transform:translateX(0);}

/* FOOTER */
footer{
  background:var(--c);border-top:1px solid rgba(244,240,232,.07);
  padding:22px 20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
@media(min-width:700px){footer{padding:26px 60px;}}
footer p{font-size:11px;color:rgba(244,240,232,.28);}
footer strong{color:rgba(244,240,232,.6);font-weight:500;}
</style>
</head>
<body>

<header id="hdr">
  <a href="home.html"><img src="LogoClub.png" class="logo-img" alt="FSP"></a>
  <a href="equipos.html" class="back-link">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Equipos
  </a>
</header>

<section class="hero">
  <div class="hero-photo"></div>
  <div class="hero-tint"></div>
  <div class="hero-grain"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">Academy · Femenino Santa Ponsa</div>
    <h1 class="hero-title">Infantil</h1>
  </div>
</section>

<div class="page">

  <div class="block">
    <div class="sr-l tag-line">Plantilla</div>
    <details class="squad-toggle sr">
      <summary>
        <div>
          <div class="squad-toggle-title">Ver jugadoras</div>
          <div class="squad-toggle-meta">Temporada 2024/25</div>
        </div>
        <svg class="squad-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="players-list" id="playersList">
        <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
        <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
        <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      </div>
    </details>
  </div>

  <div class="block">
    <div class="sr-l tag-line" style="transition-delay:.1s">Clasificación</div>
    <div class="standings sr" id="table" style="transition-delay:.1s">
      <div class="standings-row head">
        <span>Equipo</span><span>PJ</span><span>PG</span><span>PE</span><span>PP</span><span>PTS</span>
      </div>
      <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      <div class="skeleton-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </div>
  </div>

</div>

<footer>
  <p>© 2025 <strong>Femenino Santa Ponsa</strong> · Mallorca, España</p>
  <p>Hecho con pasión en Mallorca 🦙</p>
</footer>

<script>
window.addEventListener('scroll',()=>{
  document.getElementById('hdr').classList.toggle('scrolled',scrollY>60);
},{passive:true});

const ro=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});
},{threshold:0.06});
document.querySelectorAll('.sr,.sr-l').forEach(el=>ro.observe(el));

/* PLAYERS — using PapaParse to handle CSV properly */
const CSV_P="https://docs.google.com/spreadsheets/d/e/2PACX-1vQI9DhN2DTk-8kQZ1QELsUU35gN68WjPzQCr4q5QaZ32KSQW0O3f6ZxKYD6PHySwfaWHQ6JXal7C3Sh/pub?gid=0&single=true&output=csv";

async function loadPlayers(){
  const container=document.getElementById('playersList');
  try{
    const text=await(await fetch(CSV_P+'&t='+Date.now(),{cache:'no-store'})).text();
    const result=Papa.parse(text,{header:false,skipEmptyLines:true});
    const rows=result.data;
    if(rows.length<=1){
      container.innerHTML=`<div style="padding:20px 22px;color:rgba(244,240,232,.4);font-size:13px;">Sin jugadoras todavía.</div>`;
      return;
    }
    let html='';
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      const dorsal=r[0]||'';
      const nombre=r[1]||'';
      const posicion=r[2]||'';
      if(!nombre)continue;
      const url='jugadora.html?jugadora='+encodeURIComponent(nombre);
      html+=`<a class="player-item" href="${url}">
        <div class="player-dorsal">${dorsal}</div>
        <div class="player-name">${nombre}</div>
        <div class="player-pos">${posicion}</div>
      </a>`;
    }
    container.innerHTML=html||`<div style="padding:20px 22px;color:rgba(244,240,232,.4);font-size:13px;">Sin jugadoras.</div>`;
  }catch(e){
    container.innerHTML=`<div style="padding:20px 22px;color:rgba(244,240,232,.4);font-size:13px;">Error cargando plantilla.</div>`;
  }
}
loadPlayers();

/* STANDINGS */
const CSV_T="https://docs.google.com/spreadsheets/d/e/2PACX-1vS5vTKhCnEoTacQdpcmWgqiiBGrVZmyQBpG59Pdg1ipAT2nAYuFynAlfa9i_ICdd9Kt2UvHlbC1JCE4/pub?output=csv";
async function loadTable(){
  const container=document.getElementById('table');
  try{
    const text=await(await fetch(CSV_T+'&t='+Date.now(),{cache:'no-store'})).text();
    const result=Papa.parse(text,{header:false,skipEmptyLines:true});
    const rows=result.data;
    let equipos=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      equipos.push({nombre:r[0]||'-',pj:r[1]||'0',pg:r[2]||'0',pe:r[3]||'0',pp:r[4]||'0',puntos:parseInt(r[5])||0});
    }
    equipos.sort((a,b)=>b.puntos-a.puntos);
    let html=`<div class="standings-row head"><span>Equipo</span><span>PJ</span><span>PG</span><span>PE</span><span>PP</span><span>PTS</span></div>`;
    equipos.forEach((eq,i)=>{
      const sp=eq.nombre.toLowerCase().includes('santa ponsa');
      html+=`<div class="standings-row ${sp?'highlight':''}">
        <div class="team-col"><span class="team-pos">${i+1}</span><span class="team-name">${eq.nombre}</span></div>
        <span>${eq.pj}</span><span>${eq.pg}</span><span>${eq.pe}</span><span>${eq.pp}</span>
        <span class="pts-col">${eq.puntos}</span>
      </div>`;
    });
    container.innerHTML=html;
  }catch{
    container.innerHTML=`<div style="padding:24px;text-align:center;color:var(--mid);font-size:13px;">Error cargando clasificación</div>`;
  }
}
loadTable();
</script>
</body>
</html>
