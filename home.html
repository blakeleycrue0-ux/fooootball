<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Femenino SP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:black;
    color:white;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:85px;
    background:#000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.header-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    height:50px;
}

.club-name{
    font-family:'Montserrat', sans-serif;
    font-size:28px;
    font-weight:900;
    text-transform:uppercase;
}

.nav-desktop{
    display:flex;
    gap:30px;
}

.nav-desktop a{
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
}

.user-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.username{
    font-weight:700;
    font-size:14px;
}

.logout{
    padding:8px 14px;
    border-radius:20px;
    background:white;
    color:black;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    border:none;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    align-items:center;
    padding:0 8%;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-family:'Montserrat', sans-serif;
    font-size:70px;
    font-weight:900;
    text-transform:uppercase;
}

/* MATCHES */
.matches-section{
    background:#000;
    padding:80px 0;
}

.matches-scroll{
    display:flex;
    gap:25px;
    overflow-x:auto;
    padding:30px;
    scroll-snap-type:x mandatory;
}

.matches-scroll::-webkit-scrollbar{
    display:none;
}

.match-card.big{
    min-width:340px;
    height:200px;
    background:rgba(17,17,17,0.75);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
    scroll-snap-align:start;
}

.match-card.big::after{
    content:"";
    position:absolute;
    bottom:-1px;
    right:-1px;
    width:160px;
    height:160px;
    background: linear-gradient(135deg, transparent 48%, #000 50%);
}

/* NEWS */
.news-section{
    background:black;
    padding:80px 8%;
}

.section-title h2{
    font-family:'Montserrat', sans-serif;
    font-size:42px;
    font-weight:900;
    margin-bottom:20px;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.news-card{
    background:#111;
    overflow:hidden;
}

.news-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.news-content{
    padding:15px;
}

.news-content span{
    font-size:12px;
    color:#888;
    font-weight:700;
}

.news-content h3{
    font-size:18px;
    margin-top:8px;
}

/* MOBILE */
@media(max-width:768px){

    .hero h1{
        font-size:42px;
    }

    .nav-desktop{
        display:none;
    }
}

</style>
</head>

<body>

<header>
    <div class="header-left">
        <img src="Logoclub.png" class="logo">
        <div class="club-name">FEMENINO</div>
    </div>

    <nav class="nav-desktop">
        <a href="#">Noticias</a>
        <a href="equipos.html">Equipos</a>
        <a href="#">Tienda</a>
    </nav>

    <div class="user-area">
        <div class="username" id="username">Usuario</div>
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</header>

<section class="hero">
    <h1>FEMENINO<br>SANTA PONSA</h1>
</section>

<!-- PARTIDOS -->
<section class="matches-section">
    <div class="matches-scroll" id="matches"></div>
</section>

<!-- NOTICIAS -->
<section class="news-section">

    <div class="section-title">
        <h2>Noticias</h2>
    </div>

    <div class="news-grid">

        <div class="news-card">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018">
            <div class="news-content">
                <span>CLUB</span>
                <h3>Victoria importante del equipo</h3>
            </div>
        </div>

        <div class="news-card">
            <img src="https://images.unsplash.com/photo-1518604666860-9ed391f76460">
            <div class="news-content">
                <span>PLANTILLA</span>
                <h3>Convocatoria del fin de semana</h3>
            </div>
        </div>

    </div>

</section>

<script>

const user = localStorage.getItem("user");

if(!user){
    window.location.href = "login.html";
}

document.getElementById("username").innerText = user;

/* PARTIDOS DESDE GOOGLE SHEETS */
const MATCH_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROl6WbsPXPVL53qaxHda0Ag5136ezyS3XKIVh0mhdA8nLm21YkksCCyHiQadeT20dlUArez3HeifPq/pub?output=csv";

function parseRow(r){
    return r.split(/[,;]/).map(x => x.trim());
}

async function loadMatches(){

    const container = document.getElementById("matches");

    try{

        const res = await fetch(MATCH_URL + "&t=" + Date.now(), {
            cache:"no-store"
        });

        const text = await res.text();

        const rows = text.split("\n").filter(r => r.trim());

        let html = "";

        for(let i=1;i<rows.length;i++){

            const c = parseRow(rows[i]);

            html += `
            <div class="match-card big">
                <h3>${c[0] || ""}</h3>
                <p>${c[1] || ""}</p>
                <div class="score">${c[2] || ""}</div>
            </div>
            `;
        }

        container.innerHTML = html;

    } catch(err){
        container.innerHTML = "<div style='color:white'>Error cargando partidos</div>";
    }
}

loadMatches();

/* LOGOUT */
function logout(){
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

</script>

</body>
</html>
