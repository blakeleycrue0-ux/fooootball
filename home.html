<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Femenino SP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@500;700;900&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    background:black;
    color:white;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:85px;
    background:#000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
    z-index:1000;
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    height:45px;
}

.club-name{
    font-family:'Montserrat', sans-serif;
    font-size:28px;
    font-weight:900;
}

/* NAV */
.nav-desktop{
    display:flex;
    gap:25px;
}

.nav-desktop a{
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
}

/* USER */
.user-dropdown{
    position:relative;
    cursor:pointer;
    padding:8px 14px;
    border-radius:20px;
    background:#fff;
    color:#000;
    font-weight:700;
    max-width:160px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.user-menu{
    position:absolute;
    top:110%;
    right:0;
    background:white;
    color:black;
    border-radius:10px;
    padding:8px;
    display:none;
    min-width:140px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.user-menu button{
    width:100%;
    border:none;
    background:none;
    padding:10px;
    font-weight:700;
    cursor:pointer;
    text-align:left;
}

/* MENU MOBILE */
.menu-icon{
    display:none;
    font-size:30px;
    cursor:pointer;
}

.mobile-menu{
    position:fixed;
    top:85px;
    left:0;
    width:100%;
    background:black;
    display:none;
    flex-direction:column;
    padding:20px;
    z-index:999;
}

.mobile-menu a{
    color:white;
    text-decoration:none;
    margin-bottom:15px;
    font-weight:700;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    align-items:center;
    padding:0 8%;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-family:'Montserrat', sans-serif;
    font-size:70px;
    font-weight:900;
}

/* MATCHES */
.matches-section{
    padding:80px 8%;
}

.matches-scroll{
    display:flex;
    gap:20px;
    overflow-x:auto;
}

.matches-scroll::-webkit-scrollbar{
    display:none;
}

.match-card.big{
    min-width:360px;
    height:230px;
    background:#f2f2f2;
    color:black;
    padding:30px 25px 20px 25px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.match-status{
    font-family:'Oswald', sans-serif;
    font-size:14px;
    font-weight:700;
    margin-bottom:20px;
}

.team-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
    align-items:center;
}

.team-name{
    font-family:'Oswald', sans-serif;
    font-size:36px;
    text-transform:uppercase;
}

.team-score{
    font-family:'Oswald', sans-serif;
    font-size:36px;
    color:#5f7890;
}

.match-link{
    margin-top:auto;
    font-family:'Oswald', sans-serif;
    font-size:18px;
    color:#5f7890;
}

/* NEWS */
.news-section{
    padding:80px 8%;
}

.news-scroll{
    display:flex;
    gap:20px;
    overflow-x:auto;
}

.news-scroll::-webkit-scrollbar{
    display:none;
}

.news-card{
    min-width:320px;
    background:#111;
    flex-shrink:0;
    border-radius:10px;
    overflow:hidden;
}

.news-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.news-content{
    padding:15px;
}

/* MOBILE */
@media(max-width:768px){

    .nav-desktop{
        display:none;
    }

    .menu-icon{
        display:block;
    }

    .hero h1{
        font-size:42px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-left">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <img src="Logoclub.png" class="logo">
        <div class="club-name">FEMENINO</div>
    </div>

    <nav class="nav-desktop">
        <a href="#">Historia</a>
        <a href="#">Club</a>
        <a href="equipos.html">Equipos</a>
        <a href="#">Tienda</a>
    </nav>

    <div class="user-dropdown" onclick="toggleUserMenu()">
        <span id="username">Usuario</span>
        <div class="user-menu" id="userMenu">
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </div>

</header>

<div class="mobile-menu" id="mobileMenu">
    <a href="#">Historia</a>
    <a href="#">Club</a>
    <a href="equipos.html">Equipos</a>
    <a href="#">Tienda</a>
</div>

<section class="hero">
    <h1>FEMENINO<br>SANTA PONSA</h1>
</section>

<section class="matches-section">
    <div class="matches-scroll" id="matchesContainer"></div>
</section>

<section class="news-section">
    <div class="news-scroll">

        <div class="news-card">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018">
            <div class="news-content">
                <h3>Victoria del equipo</h3>
            </div>
        </div>

        <div class="news-card">
            <img src="https://images.unsplash.com/photo-1518604666860-9ed391f76460">
            <div class="news-content">
                <h3>Convocatoria del fin de semana</h3>
            </div>
        </div>

    </div>
</section>

<script>

/* LOGIN */
const user = localStorage.getItem("user");

if(!user){
    window.location.href="login.html";
}

document.getElementById("username").innerText=user;

/* LOGOUT */
function logout(){
    localStorage.removeItem("user");
    window.location.href="login.html";
}

/* USER MENU */
function toggleUserMenu(){
    const menu=document.getElementById("userMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* cerrar menú usuario al click fuera */
document.addEventListener("click", function(e){
    const user=document.querySelector(".user-dropdown");
    const menu=document.getElementById("userMenu");

    if(!user.contains(e.target)){
        menu.style.display="none";
    }
});

/* MENU MOBILE */
function toggleMenu(){
    const menu=document.getElementById("mobileMenu");
    menu.style.display =
        menu.style.display==="flex" ? "none":"flex";
}

/* MATCHES */
const MATCHES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQa33RBs9U2PKwF4XVxyYcxfWCsAmlBcowlfUG9B2KIGh6bZLF6MSbTvvYrDuMi_MDXStAlB0p2V1AQ/pub?output=csv";

function parseRow(row){
    return row.split(",").map(x=>x.trim());
}

async function loadMatches(){

    const container=document.getElementById("matchesContainer");

    try{

        const res=await fetch(MATCHES_URL+"&t="+Date.now());
        const text=await res.text();

        const rows=text.split("\n").filter(r=>r.trim());

        let html="";

        for(let i=1;i<rows.length;i++){

            const c=parseRow(rows[i]);

            html += `
            <div class="match-card big">

                <div class="match-status">${c[0]}</div>

                <div class="team-row">
                    <div class="team-name">${c[1]}</div>
                    <div class="team-score">${c[2]}</div>
                </div>

                <div class="team-row">
                    <div class="team-name">${c[3]}</div>
                    <div class="team-score">${c[4]}</div>
                </div>

                <div class="match-link">
                    MATCH CENTER >
                </div>

            </div>`;
        }

        container.innerHTML=html;

    }catch(e){
        container.innerHTML="<p>Error cargando partidos</p>";
    }
}

loadMatches();

</script>

</body>
</html>

</body>
</html>
