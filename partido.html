<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partido | Femenino Santa Ponsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Familjen+Grotesk:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root {
  --c: #0a0a0a;
  --w: #f4f0e8;
  --acc: #a855f7;
  --acc2: #d8b4fe;
  --mid: #888;
  --border: rgba(10,10,10,0.12);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--w);color:var(--c);font-family:'Familjen Grotesk',sans-serif;overflow-x:hidden;}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:500;
  transition:background .4s;
}
header.scrolled{
  background:rgba(244,240,232,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo-img{height:40px;width:auto;}
.back-link{
  display:flex;align-items:center;gap:8px;
  font-family:'Unbounded',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--c);text-decoration:none;transition:color .3s;
}
.back-link:hover{color:var(--acc);}
.back-link svg{width:14px;height:14px;}

/* HERO — score section */
.hero{
  position:relative;min-height:50vh;
  background:var(--c);
  display:flex;align-items:flex-end;overflow:hidden;
}
.hero-tint{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,1) 0%,rgba(10,10,10,.7) 50%,rgba(88,28,220,.15) 100%);
}
.hero-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.25;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;mix-blend-mode:overlay;
}
.hero-inner{
  position:relative;z-index:2;
  padding:100px 20px 48px;width:100%;
}

.hero-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(244,240,232,.35);
  display:flex;align-items:center;gap:10px;margin-bottom:28px;
  opacity:0;animation:fadeUp .7s .2s forwards;
}
.hero-eyebrow::before{content:'';display:block;width:20px;height:1px;background:var(--acc);}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

/* SCOREBOARD */
.scoreboard{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  opacity:0;animation:fadeUp .8s .4s forwards;
}
.team-block{flex:1;}
.team-block.away{text-align:right;}
.team-label{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(16px,5vw,32px);font-weight:900;
  letter-spacing:-.02em;line-height:1;
  color:var(--w);text-transform:uppercase;
}
.team-label.hollow{
  color:transparent;-webkit-text-stroke:1px rgba(244,240,232,.4);
}
.score-block{
  text-align:center;flex-shrink:0;
}
.score-num{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(48px,14vw,96px);font-weight:900;
  letter-spacing:-.04em;line-height:1;
  color:var(--acc2);
}
.score-sep{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(24px,6vw,48px);font-weight:300;
  color:rgba(244,240,232,.2);
  margin:0 4px;
}

/* META ROW */
.meta-row{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin-top:20px;
  opacity:0;animation:fadeUp .7s .6s forwards;
}
.meta-badge{
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(244,240,232,.35);
  background:rgba(244,240,232,.06);
  padding:6px 12px;
}

/* PAGE */
.page{padding:48px 20px 100px;max-width:860px;margin:0 auto;}

.block{margin-bottom:48px;}

.tag-line{
  font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--mid);margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.tag-line::before{content:'';display:block;width:22px;height:1px;background:var(--c);}

/* VIDEO */
.video-wrap{
  position:relative;width:100%;padding-bottom:56.25%;
  background:var(--c);border:2px solid var(--c);
}
.video-wrap iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;
}
.no-video{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Unbounded',sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(244,240,232,.2);
}

/* SUMMARY */
.summary-box{
  background:var(--c);
  border:2px solid var(--c);
  padding:28px 24px;
}
.summary-text{
  font-size:15px;line-height:1.85;
  color:rgba(244,240,232,.6);font-weight:300;
}

/* SCROLL REVEAL */
.sr{opacity:0;transform:translateY(36px);transition:opacity .9s ease,transform .9s ease;}
.sr.in{opacity:1;transform:translateY(0);}
.sr-l{opacity:0;transform:translateX(-30px);transition:opacity .9s ease,transform .9s ease;}
.sr-l.in{opacity:1;transform:translateX(0);}

/* FOOTER */
footer{
  background:var(--c);border-top:1px solid rgba(244,240,232,.07);
  padding:22px 20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
footer p{font-size:11px;color:rgba(244,240,232,.28);}
footer strong{color:rgba(244,240,232,.6);font-weight:500;}
</style>
</head>
<body>

<header id="hdr">
  <a href="home.html"><img src="LogoClub.png" class="logo-img" alt="FSP"></a>
  <a href="home.html" class="back-link">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver
  </a>
</header>

<section class="hero">
  <div class="hero-tint"></div>
  <div class="hero-grain"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow" id="heroEyebrow">Femenino Santa Ponsa</div>
    <div class="scoreboard">
      <div class="team-block">
        <div class="team-label" id="teamLocal">—</div>
      </div>
      <div class="score-block">
        <span class="score-num" id="scoreLocal">—</span>
        <span class="score-sep">:</span>
        <span class="score-num" id="scoreVisit">—</span>
      </div>
      <div class="team-block away">
        <div class="team-label hollow" id="teamVisit">—</div>
      </div>
    </div>
    <div class="meta-row">
      <span class="meta-badge" id="metaFecha"></span>
      <span class="meta-badge" id="metaLugar"></span>
    </div>
  </div>
</section>

<div class="page">

  <div class="block">
    <div class="sr-l tag-line">Vídeo</div>
    <div class="video-wrap sr" id="videoWrap">
      <div class="no-video">Vídeo no disponible</div>
    </div>
  </div>

  <div class="block" id="summaryBlock" style="display:none;">
    <div class="sr-l tag-line">Resumen</div>
    <div class="summary-box sr">
      <p class="summary-text" id="summaryText"></p>
    </div>
  </div>

</div>

<footer>
  <p>© 2025 <strong>Femenino Santa Ponsa</strong> · Mallorca, España</p>
  <p>Hecho con pasión en Mallorca 🦙</p>
</footer>

<script>
window.addEventListener('scroll',()=>{
  document.getElementById('hdr').classList.toggle('scrolled',scrollY>60);
},{passive:true});

const ro=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});
},{threshold:0.06});
document.querySelectorAll('.sr,.sr-l').forEach(el=>ro.observe(el));

/* GET YOUTUBE EMBED ID */
function getYoutubeId(url){
  if(!url)return null;
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&\n?#]+)/);
  return m?m[1]:null;
}

/* LOAD MATCH */
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQBoflKtfjowAgoFp-tVa4leFC_xcwv3kHlwBMNHjY_2NqCprwZOGSrYNLEYN8Z7GyEGT7fiDkA3yv1/pub?output=csv";

Papa.parse(CSV+'&t='+Date.now(),{
  download:true,
  skipEmptyLines:true,
  complete:function(results){
    const rows=results.data;
    const params=new URLSearchParams(window.location.search);
    const id=params.get('id');

    // find row by ID (col A)
    let row=null;
    for(let i=1;i<rows.length;i++){
      if(rows[i][0]===id){row=rows[i];break;}
    }
    if(!row&&rows.length>1)row=rows[1]; // fallback first match

    if(!row)return;

    // A=ID, B=Local, C=Visitante, D=Resultado, E=Fecha, F=Lugar, G=Video, H=Resumen
    const local=row[1]||'';
    const visit=row[2]||'';
    const result=(row[3]||'').split(/[-:]/).map(s=>s.trim());
    const fecha=row[4]||'';
    const lugar=row[5]||'';
    const video=row[6]||'';
    const resumen=row[7]||'';

    document.getElementById('teamLocal').textContent=local;
    document.getElementById('teamVisit').textContent=visit;
    document.getElementById('scoreLocal').textContent=result[0]||'—';
    document.getElementById('scoreVisit').textContent=result[1]||'—';
    if(fecha)document.getElementById('metaFecha').textContent=fecha;
    if(lugar)document.getElementById('metaLugar').textContent=lugar;
    document.title=local+' vs '+visit+' | FSP';

    const ytId=getYoutubeId(video);
    if(ytId){
      document.getElementById('videoWrap').innerHTML=
        `<iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>`;
    }

    if(resumen){
      document.getElementById('summaryText').textContent=resumen;
      document.getElementById('summaryBlock').style.display='block';
    }
  }
});
</script>
</body>
</html>
