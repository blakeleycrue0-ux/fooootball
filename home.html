<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femenino SP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    z-index:1000;
}

/* IZQUIERDA */
.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

/* HAMBURGUESA */
.menu-icon{
    font-size:26px;
    cursor:pointer;
}

/* LOGO */
.logo{
    height:30px;
    width:auto;
}

/* TITULO */
.club-name{
    font-size:16px;
    font-weight:800;
    font-family:'Montserrat', sans-serif;
}

/* USER */
.user{
    background:white;
    color:black;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

/* MENU MOBILE */
.mobile-menu{
    position:fixed;
    top:80px;
    left:0;
    width:100%;
    background:#111;
    display:none;
    flex-direction:column;
    padding:15px;
    z-index:999;
}

.mobile-menu a{
    color:white;
    text-decoration:none;
    padding:14px 0;
    border-bottom:1px solid #222;
    font-size:16px;
}

/* HERO */
.hero{
    height:85vh;
    display:flex;
    align-items:flex-end;
    padding:20px;
    background:
    linear-gradient(to top, rgba(0,0,0,0.9), transparent 60%),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:34px;
    font-weight:800;
    font-family:'Montserrat';
}

/* SECCIONES */
.section{
    padding:18px;
}

/* TITULO */
.title{
    font-size:12px;
    opacity:0.6;
    margin-bottom:10px;
}

/* MATCH CARD */
.card{
    background:#141414;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
}

/* STATUS */
.status{
    font-size:11px;
    opacity:0.6;
    margin-bottom:8px;
}

/* ROW */
.row{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    margin:6px 0;
}

/* NEWS */
.news{
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.news-card{
    min-width:200px;
    background:#141414;
    border-radius:10px;
    overflow:hidden;
}

.news-card img{
    width:100%;
    height:110px;
    object-fit:cover;
}

.news-card div{
    padding:8px;
    font-size:13px;
}

/* SPACE */
.spacer{
    height:80px;
}

</style>
</head>

<body>

<header>

    <div class="header-left">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <img src="LogoClub.png" class="logo">
        <div class="club-name">FEMENINO</div>
    </div>

    <div class="user" id="username">Usuario</div>

</header>

<!-- MENU -->
<div class="mobile-menu" id="mobileMenu">
    <a href="#">Inicio</a>
    <a href="#">Equipos</a>
    <a href="#">Club</a>
    <a href="#">Tienda</a>
</div>

<!-- HERO -->
<div class="hero">
    <h1>FEMENINO<br>SANTA PONSA</h1>
</div>

<!-- MATCHES -->
<div class="section">
    <div class="title">PARTIDOS</div>
    <div id="matches"></div>
</div>

<!-- NEWS -->
<div class="section">
    <div class="title">NOTICIAS</div>

    <div class="news">

        <div class="news-card">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018">
            <div>Victoria del equipo</div>
        </div>

        <div class="news-card">
            <img src="https://images.unsplash.com/photo-1518604666860-9ed391f76460">
            <div>Convocatoria</div>
        </div>

    </div>
</div>

<div class="spacer"></div>

<script>

/* LOGIN */
const user = localStorage.getItem("user");

if(!user){
    window.location.href="login.html";
}

document.getElementById("username").innerText = user;

/* MENU */
function toggleMenu(){
    const menu = document.getElementById("mobileMenu");
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

/* MATCHES */
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfAIC8-HY_kpednFu3CUewnmg-_Uy52_ZOBGWQx_oSe_0Dr4hVZS_BicuNUnIFLXu18L4LdZXin2qx/pub?output=csv";

async function load(){

    const res = await fetch(URL);
    const text = await res.text();

    const rows = text.split("\n").filter(r => r.trim());

    let html = "";

    for(let i=1;i<rows.length;i++){

        const c = rows[i]
            .split(",")
            .map(x => x.replace(/"/g,"").trim());

        if(!c[1]) continue;

        html += `
        <div class="card">

            <div class="status">${c[0]}</div>

            <div class="row">
                <span>${c[1]}</span>
                <span>${c[2]}</span>
            </div>

            <div class="row">
                <span>${c[3]}</span>
                <span>${c[4]}</span>
            </div>

        </div>
        `;
    }

    document.getElementById("matches").innerHTML = html;
}

load();

</script>

</body>
</html>

</body>
</html>
