<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Center</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Inter;
    background:#0b0b0b;
    color:white;
}

.top{
    text-align:center;
    padding:40px 20px;
}

.status{
    font-weight:800;
    opacity:.7;
    text-transform:uppercase;
}

.teams{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin-top:20px;
}

.team{
    text-align:center;
}

.team img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.score{
    font-size:50px;
    font-weight:900;
}

.events{
    max-width:800px;
    margin:40px auto;
    padding:0 20px;
}

.event{
    background:#151515;
    margin-bottom:12px;
    padding:15px;
    border-left:4px solid #333;
    border-radius:8px;
    display:flex;
    gap:15px;
}

.minute{
    width:50px;
    font-weight:900;
    color:#aaa;
}

.type{
    font-weight:700;
}

</style>
</head>

<body>

<div class="top">

    <div class="status" id="status">Cargando...</div>

    <div class="teams">

        <div class="team">
            <img id="homeLogo">
            <div id="homeName"></div>
        </div>

        <div class="score" id="score">-</div>

        <div class="team">
            <img id="awayLogo">
            <div id="awayName"></div>
        </div>

    </div>
</div>

<div class="events" id="events"></div>

<script>

const MATCHSHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfAIC8-HY_kpednFu3CUewnmg-_Uy52_ZOBGWQx_oSe_0Dr4hVZS_BicuNUnIFLXu18L4LdZXin2qx/pub?output=csv";
const EVENTSHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfAIC8-HY_kpednFu3CUewnmg-_Uy52_ZOBGWQx_oSe_0Dr4hVZS_BicuNUnIFLXu18L4LdZXin2qx/pub?output=csv";

/* 👇 AQUÍ YA NO USAMOS ID */
const params = new URLSearchParams(window.location.search);
const index = params.get("i"); // fila del partido

/* MATCH DATA */
fetch(MATCHSHEET)
.then(r => r.text())
.then(text => {

    const rows = text
        .trim()
        .split("\n")
        .map(r => r.split(",").map(x => x.replace(/"/g,"").trim()));

    const c = rows[Number(index) + 1]; 
    // +1 porque fila 0 es header

    if(!c){
        document.getElementById("status").innerText = "PARTIDO NO ENCONTRADO";
        return;
    }

    document.getElementById("status").innerText = c[1];
    document.getElementById("homeName").innerText = c[2];
    document.getElementById("awayName").innerText = c[4];
    document.getElementById("score").innerText = c[3] + " - " + c[5];

    document.getElementById("homeLogo").src = c[6];
    document.getElementById("awayLogo").src = c[7];

});

/* EVENTS */
fetch(EVENTSHEET)
.then(r => r.text())
.then(text => {

    const rows = text
        .trim()
        .split("\n")
        .map(r => r.split(",").map(x => x.replace(/"/g,"").trim()));

    let html = "";

    for(let i=1;i<rows.length;i++){

        const c = rows[i];

        if(c[0] != index) continue;

        html += `
        <div class="event">
            <div class="minute">${c[1]}'</div>
            <div>
                <div class="type">${c[2]} - ${c[3]}</div>
                <div>${c[5]}</div>
            </div>
        </div>`;
    }

    document.getElementById("events").innerHTML = html;

});

</script>

</body>
</html>

</body>
</html>
