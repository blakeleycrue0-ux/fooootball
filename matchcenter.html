<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Center</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:black;
    color:white;
    font-family:'Montserrat', sans-serif;
}

/* HEADER */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 25px;
}

.back-btn{
    background:white;
    color:black;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

/* MATCH BOX */
.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#111;
    padding:30px;
    border-radius:15px;
    text-align:center;
}

/* TEAMS */
.teams{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:30px;
}

.team{
    width:40%;
}

.team img{
    width:90px;
    height:90px;
    object-fit:contain;
    margin-bottom:10px;
}

.score{
    font-size:40px;
    font-weight:800;
}

/* STATUS */
.status{
    font-size:18px;
    opacity:0.8;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="topbar">
    <button class="back-btn" onclick="goHome()">← Volver</button>
</div>

<div class="container" id="content">
    Cargando partido...
</div>

<script>

const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfAIC8-HY_kpednFu3CUewnmg-_Uy52_ZOBGWQx_oSe_0Dr4hVZS_BicuNUnIFLXu18L4LdZXin2qx/pub?output=csv";

function getId(){
    return new URLSearchParams(window.location.search).get("id");
}

function goHome(){
    window.location.href = "home.html";
}

async function load(){

    const id = getId();

    const res = await fetch(URL);
    const text = await res.text();

    const rows = text.split("\n").filter(r => r.trim());

    let m = null;

    for(let i=1;i<rows.length;i++){

        const c = rows[i].split(",").map(x => x.replace(/"/g,"").trim());

        if(c[7] === id){
            m = c;
            break;
        }
    }

    if(!m){
        document.getElementById("content").innerHTML = "Partido no encontrado";
        return;
    }

    document.getElementById("content").innerHTML = `
        <div class="card">

            <div class="status">${m[0]}</div>

            <h2>${m[1]} vs ${m[3]}</h2>

            <div class="teams">

                <div class="team">
                    <img src="${m[5]}" onerror="this.src='default.png'">
                    <div>${m[1]}</div>
                    <div class="score">${m[2]}</div>
                </div>

                <div class="team">
                    <img src="${m[6]}" onerror="this.src='default.png'">
                    <div>${m[3]}</div>
                    <div class="score">${m[4]}</div>
                </div>

            </div>

        </div>
    `;
}

load();

</script>

</body>
</html>

</body>
</html>
