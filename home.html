<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femenino Santa Ponsa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Anton&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<!-- SOLO AÑADIDO: parser CSV fiable -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color: transparent;
}

html{scroll-behavior:smooth;}

body{
background:#000;
color:white;
font-family:'Inter',sans-serif;
overflow-x:hidden;
}

/* TU DISEÑO ORIGINAL SE MANTIENE */
.fade-up{
opacity:0;
transform:translateY(40px);
transition:.9s ease;
}

.fade-up.show{
opacity:1;
transform:translateY(0);
}

header{
position:fixed;
top:0;
left:0;
width:100%;
height:70px;
background:rgba(0,0,0,0.95);
backdrop-filter:blur(12px);
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{height:42px;}

.menu-btn{
position:absolute;
left:20px;
font-size:24px;
cursor:pointer;
}

.mobile-menu{
position:fixed;
top:0;
left:-100%;
width:75%;
height:100vh;
background:#0d0d0d;
z-index:2000;
padding:30px;
transition:.4s;
}

.mobile-menu.active{left:0;}

.close-btn{
font-size:30px;
margin-bottom:40px;
cursor:pointer;
}

.mobile-menu a{
display:block;
color:white;
text-decoration:none;
font-family:'Oswald';
font-size:24px;
margin:25px 0;
text-transform:uppercase;
}

/* HERO (NO TOCADO) */
.hero{
height:85vh;
background:
linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.2)),
url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
background-size:cover;
background-position:center;
display:flex;
align-items:flex-end;
padding:25px;
}

.hero h1{
font-family:'Anton';
font-size:clamp(42px,12vw,75px);
line-height:.9;
text-transform:uppercase;
margin-bottom:15px;
}

.hero p{
font-size:15px;
line-height:1.7;
color:#d9d9d9;
margin-bottom:25px;
}

.hero-btn{
display:inline-block;
padding:14px 28px;
background:white;
color:black;
text-decoration:none;
border-radius:40px;
font-weight:700;
}

/* RESTO IGUAL */
.section{padding:55px 20px;}

.section-sub{
color:#bdbdbd;
font-size:12px;
font-weight:700;
letter-spacing:2px;
margin-bottom:12px;
text-transform:uppercase;
}

.section-title{
font-family:'Anton';
font-size:clamp(30px,8vw,55px);
line-height:.95;
margin-bottom:20px;
text-transform:uppercase;
}

.section-text{
color:#d1d1d1;
line-height:1.8;
font-size:15px;
}

/* PARTIDOS (solo mejora mínima) */
.matches-scroll{
display:flex;
gap:15px;
overflow-x:auto;
padding-bottom:10px;
}

.matches-scroll::-webkit-scrollbar{display:none;}

.card{
min-width:260px;
background:white;
color:black;
padding:20px;
flex-shrink:0;
clip-path:polygon(0 0,100% 0,100% 82%,90% 100%,0 100%);
}

.status{
font-family:'Oswald';
font-size:12px;
font-weight:700;
margin-bottom:15px;
}

.row{
display:flex;
justify-content:space-between;
margin:10px 0;
}

.row span:first-child,
.row span:last-child{
font-family:'Anton';
font-size:24px;
}

/* resto tu CSS intacto */
.project-grid{
display:flex;
flex-direction:column;
gap:16px;
margin-top:30px;
}

.project-card{
background:#0d0d0d;
padding:25px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.08);
}

.project-card h3{
font-family:'Anton';
font-size:24px;
margin-bottom:12px;
}

.join{
background:#0d0d0d;
padding:60px 20px;
text-align:center;
}

.join-btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
border:2px solid white;
border-radius:40px;
color:white;
text-decoration:none;
font-weight:700;
}

.contact{text-align:center;}

.contact p{margin:12px 0;color:#d1d1d1;}

.contact a{color:white;text-decoration:none;}

.sponsors{
background:#0d0d0d;
text-align:center;
padding:60px 20px;
}

.sponsors-grid{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
margin:30px 0;
}

.sponsors-grid img{height:65px;}

.socials{
display:flex;
justify-content:center;
gap:18px;
margin-top:20px;
}

.socials img{height:35px;width:35px;}

</style>
</head>

<body>

<header>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<img src="Logoclub.png" class="logo">
</header>

<!-- MENU -->
<div class="mobile-menu" id="menu">
<div class="close-btn" onclick="toggleMenu()">✕</div>

<a href="home.html">Inicio</a>
<a href="equipos.html">Equipos</a>
<a href="inscripcion.html">Inscripción</a>
</div>

<!-- HERO (NO TOCADO) -->
<section class="hero">
<div>
<h1>FEMENINO SANTA PONSA</h1>
<p>Un proyecto de fútbol femenino en Mallorca creado para formar y competir.</p>
<a href="inscripcion.html" class="hero-btn">INSCRIBIRME</a>
</div>
</section>

<!-- PARTIDOS -->
<section class="section fade-up">

<div class="section-sub">Calendario</div>
<h2 class="section-title">Partidos</h2>

<div class="matches-scroll" id="matches">Cargando partidos...</div>

</section>

<!-- SCRIPT (SOLO ARREGLADO LO NECESARIO) -->
<script>

function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}

/* ANIMACIONES (igual que el tuyo) */
const observer = new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("show");
}
});
});

document.querySelectorAll(".fade-up").forEach(el=>{
observer.observe(el);
});

/* PARTIDOS ARREGLADO (SIN TOCAR DISEÑO) */
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQfAIC8-HY_kpednFu3CUewnmg-_Uy52_ZOBGWQx_oSe_0Dr4hVZS_BicuNUnIFLXu18L4LdZXin2qx/pub?output=csv";

async function load(){

try{
const res = await fetch(URL);
const text = await res.text();

const data = Papa.parse(text,{skipEmptyLines:true}).data;

let html="";

for(let i=1;i<data.length;i++){
const c=data[i];
if(!c || c.length<3) continue;
if(!c[1]) continue;

html+=`
<div class="card">
<div class="status">${c[0]||""}</div>

<div class="row">
<span>${c[1]||""}</span>
<span>${c[2]||""}</span>
</div>

<div class="row">
<span>${c[3]||""}</span>
<span>${c[4]||""}</span>
</div>
</div>
`;
}

document.getElementById("matches").innerHTML =
html || "<p style='color:#aaa'>No hay partidos disponibles</p>";

}catch(e){
document.getElementById("matches").innerHTML =
"<p style='color:#aaa'>Error cargando partidos</p>";
}

}

load();

</script>

</body>
</html>
