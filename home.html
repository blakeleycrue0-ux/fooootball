<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Femenino SP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    background:black;
    color:white;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:85px;
    background:#000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    height:45px;
}

.club-name{
    font-family:'Montserrat', sans-serif;
    font-size:28px;
    font-weight:900;
    text-transform:uppercase;
}

/* NAV */
.nav-desktop{
    display:flex;
    gap:25px;
    align-items:center;
}

.nav-desktop a{
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    opacity:0.85;
    transition:0.2s;
}

.nav-desktop a:hover{
    opacity:1;
}

/* USER */
.user-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.username{
    font-weight:700;
    font-size:14px;
}

.logout{
    padding:8px 14px;
    border-radius:20px;
    background:white;
    color:black;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    border:none;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    align-items:center;
    padding:0 8%;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-family:'Montserrat', sans-serif;
    font-size:70px;
    font-weight:900;
    text-transform:uppercase;
}

/* MATCHES */
.matches-section{
    background:#000;
    padding:80px 8%;
}

.matches-scroll{
    display:flex;
    gap:20px;
    overflow-x:auto;
    padding-bottom:10px;
}

.matches-scroll::-webkit-scrollbar{
    display:none;
}

/* CARD */
.match-card.big{
    min-width:340px;
    height:200px;
    background:rgba(17,17,17,0.75);
    backdrop-filter: blur(12px);
    border:none;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:20px;
    position:relative;
    overflow:hidden;
}

/* 🔥 CORTE AJUSTADO (más abajo + más pequeño) */
.match-card.big::after{
    content:"";
    position:absolute;
    bottom:-18px;
    right:-18px;
    width:170px;
    height:170px;
    background: linear-gradient(
        135deg,
        transparent 55%,
        #000 56%
    );
    pointer-events:none;
}

/* EQUIPOS */
.match-line{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    text-transform:uppercase;
}

.team{
    font-size:18px;
}

.vs{
    font-size:12px;
    opacity:0.6;
}

/* RESULTADO */
.score{
    font-size:46px;
    font-weight:900;
    text-align:center;
}

/* NEWS */
.news-section{
    padding:80px 8%;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:25px;
    max-width:900px;
    margin:auto;
}

.news-card{
    background:#111;
}

.news-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.news-content{
    padding:15px;
}

.news-content span{
    font-size:12px;
    color:#888;
    font-weight:700;
}

.news-content h3{
    font-size:18px;
    margin-top:8px;
}

/* MOBILE */
@media(max-width:768px){

    .hero h1{font-size:42px;}

    .news-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<header>
    <div class="header-left">
        <img src="Logoclub.png" class="logo">
        <div class="club-name">FEMENINO</div>
    </div>

    <nav class="nav-desktop">
        <a href="#">Historia</a>
        <a href="#">Club</a>
        <a href="equipos.html">Equipos</a>
        <a href="#">Tienda</a>
    </nav>

    <div class="user-area">
        <div class="username" id="username">Usuario</div>
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</header>

<section class="hero">
    <h1>FEMENINO<br>SANTA PONSA</h1>
</section>

<section class="matches-section">

<div class="matches-scroll">

    <div class="match-card big">
        <div class="match-line">
            <span class="team">SP</span>
            <span class="vs">vs</span>
            <span class="team">PALMA JUV</span>
        </div>
        <div class="score">3 - 1</div>
    </div>

    <div class="match-card big">
        <div class="match-line">
            <span class="team">SP</span>
            <span class="vs">vs</span>
            <span class="team">BARÇA B</span>
        </div>
        <div class="score">2 - 2</div>
    </div>

</div>

</section>

<section class="news-section">

<div class="news-grid">

    <div class="news-card">
        <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018">
        <div class="news-content">
            <span>CLUB</span>
            <h3>Victoria del equipo</h3>
        </div>
    </div>

    <div class="news-card">
        <img src="https://images.unsplash.com/photo-1518604666860-9ed391f76460">
        <div class="news-content">
            <span>PLANTILLA</span>
            <h3>Convocatoria del fin de semana</h3>
        </div>
    </div>

</div>

</section>

<script>

const user = localStorage.getItem("user");

if(!user){
    window.location.href = "login.html";
}

document.getElementById("username").innerText = user;

function logout(){
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

</script>

</body>
</html>

</body>
</html>
